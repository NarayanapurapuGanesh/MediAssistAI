version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mediassist_db
    restart: always
    environment:
      POSTGRES_USER: mediassist
      POSTGRES_PASSWORD: mediassistpassword
      POSTGRES_DB: mediassist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
